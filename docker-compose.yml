services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notesuser
      POSTGRES_PASSWORD: notespass
      POSTGRES_DB: notesdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesuser -d notesdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: notesuser
      DB_PASSWORD: notespass
      DB_NAME: notesdb
      DB_SSL: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: